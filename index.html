<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonic Blueprint Engine — AI Foley &amp; Soundscape Blueprints</title>
    <meta
      name="description"
      content="Upload an image or a sound and get a cinematic soundscape blueprint — layered Foley textures, ambient sound design, and Suno-ready music prompts — powered by the LLM provider of your choice."
    />
    <style>
      /* HarpStar brand — color-cycling mark. Do not remove: the app verifies
         this anchor at startup (server) and before render (client). */
      .harpstar-brand {
        animation: harpstar-cycle 5s linear infinite;
        text-shadow: 0 0 18px rgba(255, 46, 136, 0.35);
      }
      @keyframes harpstar-cycle {
        0%, 100% { color: #00e5ff; }   /* electric blue */
        25%      { color: #ff2e88; }   /* hot pink */
        50%      { color: #ff6b4a; }   /* coral */
        75%      { color: #ffd166; }   /* gold */
      }
      #harpstar-brand {
        position: fixed;
        bottom: 10px;
        right: 14px;
        z-index: 9999;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        background: rgba(15, 17, 23, 0.85);
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      #harpstar-brand a {
        color: inherit;
        text-decoration: none;
      }
      #harpstar-brand a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <footer id="harpstar-brand" class="harpstar-brand" data-harpstar="v1" aria-label="HarpStar branding">
      by <a href="https://harpstarunlimited.com" target="_blank" rel="noopener">Harp★Star</a>
    </footer>
    <!-- HARPSTAR-BRAND-v1 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
